<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>netdrop</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 640px;
    margin: 40px auto;
    padding: 0 16px;
    color: #222;
  }
  h1 {
    font-size: 20px;
  }
  textarea {
    width: 100%;
    height: 200px;
    font-size: 16px;
    padding: 12px;
    box-sizing: border-box;
    resize: vertical;
  }
  button {
    margin-top: 12px;
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
  }
  #status {
    margin-top: 12px;
    font-size: 14px;
  }
  #status.ok { color: #0a7d2c; }
  #status.error { color: #c0392b; }
  #live {
    margin-top: 32px;
    padding: 12px;
    background: #f5f5f5;
    border-radius: 6px;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 24px;
  }
  #live-label {
    font-size: 14px;
    color: #666;
    margin-top: 32px;
  }
</style>
</head>
<body>
  <h1>netdrop</h1>
  <p>입력하는 내용은 접속한 모든 사람에게 실시간으로 표시됩니다. 붙여넣거나 버튼을 클릭하면 서버를 실행 중인 컴퓨터의 클립보드로도 복사됩니다.</p>
  <textarea id="text" placeholder="여기에 붙여넣으세요"></textarea>
  <br>
  <button id="send">클립보드로 전송</button>
  <div id="status"></div>

  <p id="live-label">실시간으로 붙여넣은 내용</p>
  <div id="live"></div>

  <script>
    const textArea = document.getElementById('text');
    const sendButton = document.getElementById('send');
    const status = document.getElementById('status');
    const live = document.getElementById('live');

    async function sendText(text) {
      if (!text) return;

      status.textContent = '전송 중...';
      status.className = '';

      try {
        const res = await fetch('/paste', {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain; charset=utf-8' },
          body: text,
        });
        const data = await res.json();
        if (data.ok) {
          status.textContent = '클립보드에 복사되었습니다.';
          status.className = 'ok';
          textArea.value = '';
        } else {
          status.textContent = '오류: ' + data.error;
          status.className = 'error';
        }
      } catch (err) {
        status.textContent = '오류: ' + err.message;
        status.className = 'error';
      }
    }

    sendButton.addEventListener('click', () => sendText(textArea.value));

    // 붙여넣기 시 버튼 클릭 없이 자동으로 클립보드까지 복사 (paste 이벤트 시점엔
    // textarea 값이 아직 갱신되지 않았을 수 있어 다음 틱에 값을 읽는다)
    textArea.addEventListener('paste', () => {
      setTimeout(() => sendText(textArea.value), 0);
    });

    // 타이핑하는 동안에는 클립보드는 건드리지 않고, 실시간 미리보기만 전송
    let liveTimer = null;
    textArea.addEventListener('input', () => {
      clearTimeout(liveTimer);
      liveTimer = setTimeout(() => {
        fetch('/live', {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain; charset=utf-8' },
          body: textArea.value,
        }).catch(() => {});
      }, 150);
    });

    const events = new EventSource('/events');
    events.onmessage = (event) => {
      const data = JSON.parse(event.data);
      live.textContent = data.text;
    };
  </script>
</body>
</html>
