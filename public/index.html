<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>netdrop</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 640px;
    margin: 40px auto;
    padding: 0 16px;
    color: #222;
  }
  h1 {
    font-size: 20px;
  }
  textarea {
    width: 100%;
    height: 200px;
    font-size: 16px;
    padding: 12px;
    box-sizing: border-box;
    resize: vertical;
  }
  #live {
    margin-top: 32px;
    padding: 12px;
    background: #f5f5f5;
    border-radius: 6px;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 24px;
  }
  #live-label {
    font-size: 14px;
    color: #666;
    margin-top: 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #copy {
    padding: 4px 12px;
    font-size: 13px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>netdrop</h1>
  <p>입력하는 내용은 접속한 모든 사람에게 실시간으로 표시됩니다.</p>
  <textarea id="text" placeholder="여기에 입력하세요"></textarea>

  <p id="live-label">
    실시간 미리보기
    <button id="copy" type="button">복사하기</button>
  </p>
  <div id="live"></div>

  <script>
    const textArea = document.getElementById('text');
    const live = document.getElementById('live');
    const copyButton = document.getElementById('copy');

    function copyLiveText() {
      const text = live.textContent;
      if (!text) return;

      const showResult = (label) => {
        copyButton.textContent = label;
        setTimeout(() => { copyButton.textContent = '복사하기'; }, 1500);
      };

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(
          () => showResult('복사됨!'),
          () => showResult('복사 실패')
        );
        return;
      }

      // HTTP로 접속한 경우(LAN IP 등) navigator.clipboard를 쓸 수 없어 대체 방식 사용
      const temp = document.createElement('textarea');
      temp.value = text;
      temp.style.position = 'fixed';
      temp.style.opacity = '0';
      document.body.appendChild(temp);
      temp.focus();
      temp.select();
      try {
        document.execCommand('copy');
        showResult('복사됨!');
      } catch (err) {
        showResult('복사 실패');
      }
      document.body.removeChild(temp);
    }

    copyButton.addEventListener('click', copyLiveText);

    let liveTimer = null;
    textArea.addEventListener('input', () => {
      clearTimeout(liveTimer);
      liveTimer = setTimeout(() => {
        fetch('/live', {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain; charset=utf-8' },
          body: textArea.value,
        }).catch(() => {});
      }, 150);
    });

    const events = new EventSource('/events');
    events.onmessage = (event) => {
      const data = JSON.parse(event.data);
      live.textContent = data.text;
    };
  </script>
</body>
</html>
